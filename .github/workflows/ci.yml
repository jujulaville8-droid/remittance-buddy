name: CI
on:
  push:
    branches: [main, review/comparison-trust-extension]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ENABLE_TRANSFER_EXECUTION: 'false'
      ENABLE_PAID_PLANS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint web
        run: pnpm --filter @remit/web lint
      - name: Type-check
        run: pnpm type-check
      - name: Test web and API comparison contracts
        run: pnpm test
      - name: Build extension package
        run: pnpm --filter @remit/extension build
      - name: Build web
        run: pnpm --filter @remit/web build
      - uses: actions/upload-artifact@v4
        with:
          name: my-remittance-pal-extension
          path: apps/extension/dist/
# Vercel's existing Git integration owns deployment. No duplicate CLI deployment,
# token-dependent expressions, or ignored type-check failures are used here.
